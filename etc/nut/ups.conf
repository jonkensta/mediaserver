# NUT driver config for the CyberPower CP850PFCLCDa (USB).
# Deployed to /etc/nut/ups.conf.
maxretry = 3

[cyberpower]
    driver = usbhid-ups
    port = auto
    vendorid = 0764
    productid = 0601
    desc = "CyberPower CP850PFCLCDa"
    # Decide low battery ourselves instead of trusting the UPS (its own LB
    # fires around 10%, too late for an ageing battery): LB is raised when
    # charge drops below 50% or estimated runtime below 10 minutes. The usual
    # trigger is upssched's 5-minute on-battery timer (upssched.conf); this is
    # the backstop.
    ignorelb
    override.battery.charge.low = 50
    override.battery.runtime.low = 600
    # Killpower (nutshutdown hook, after the OS has halted): cut the outlets
    # 60s later, and turn them back on 120s after mains returns. The BIOS is
    # set to "AC power lost policy: Power on", so the outlets coming back is
    # what boots the machine. CyberPower wants ondelay > offdelay.
    offdelay = 60
    ondelay = 120
