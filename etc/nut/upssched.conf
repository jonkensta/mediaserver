# upsmon hands ONBATT/ONLINE events to upssched (NOTIFYCMD in upsmon.conf).
# Deployed to /etc/nut/upssched.conf.
CMDSCRIPT /usr/local/bin/ups-sched-cmd
PIPEFN /var/lib/nut/upssched/upssched.pipe
LOCKFN /var/lib/nut/upssched/upssched.lock

# Ride out flickers and short outages: only shut down after 5 minutes on
# battery. Mains coming back cancels the timer.
AT ONBATT * START-TIMER onbatt-shutdown 300
AT ONLINE * CANCEL-TIMER onbatt-shutdown
