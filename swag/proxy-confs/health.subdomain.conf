# Deployed to /opt/mediaserver/swag/nginx/proxy-confs/health.subdomain.conf.
# Health dashboard (scale + blood pressure), admins only via the *.jstarr.me
# Authelia rule. The collector posts to health:8080 directly, not through here.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name health.*;

    include /config/nginx/ssl.conf;

    include /config/nginx/authelia-server.conf;

    location / {
        include /config/nginx/authelia-location.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app health;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
