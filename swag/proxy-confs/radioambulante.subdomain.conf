## Radio Ambulante study app (static nginx container "radioambulante")
# Everything is behind Authelia except the icons and web manifest: browsers fetch
# the manifest without cookies, so behind auth home-screen shortcuts get no icon.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name radioambulante.*;

    include /config/nginx/ssl.conf;

    include /config/nginx/authelia-server.conf;

    location / {
        include /config/nginx/authelia-location.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app radioambulante;
        set $upstream_port 80;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    location ~ ^/(favicon\.svg|icon-(192|512)\.png|apple-touch-icon\.png|manifest\.webmanifest)$ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app radioambulante;
        set $upstream_port 80;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
