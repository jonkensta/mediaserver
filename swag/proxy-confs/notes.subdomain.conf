## Memos (container "memos") at notes.jstarr.me
# Authelia is Memos' login (OIDC client "memos", see authelia/configuration.yml),
# with registration and password login disabled in Memos. Phone apps, scripts
# and MCP clients (/api/, /mcp) use Memos personal access tokens, so the app as
# a whole is not behind forward auth.
#
# Exception: the sign-in endpoints. Memos exempts admins from "disallow
# password auth" (lockout protection), so an admin password would still work
# from anywhere. Gating sign-in with Authelia closes that: the SSO flow already
# holds an Authelia session when it reaches these endpoints, a bare password
# attempt does not. Token clients never call them.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name notes.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    include /config/nginx/authelia-server.conf;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app memos;
        set $upstream_port 5230;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # REST and Connect forms of AuthService.SignIn.
    location ~ ^/(api/auth/signin|memos\.api\.AuthService/SignIn)$ {
        include /config/nginx/authelia-location.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app memos;
        set $upstream_port 5230;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
