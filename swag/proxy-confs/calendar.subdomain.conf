# Deployed to /opt/mediaserver/swag/nginx/proxy-confs/calendar.subdomain.conf.
# Everything is behind Authelia except the picks feed, /cal/<token>.ics: calendar
# clients can't follow a forward-auth redirect, so the token in the URL is the
# credential (like healthchecks' /ping/).

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name calendar.*;

    include /config/nginx/ssl.conf;
    include /config/nginx/authelia-server.conf;

    location / {
        include /config/nginx/authelia-location.conf;
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app austin-calendar;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    location ~ ^/cal/[A-Za-z0-9_-]+\.ics$ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app austin-calendar;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
