## Mock TDCJ Book Portal (ibp-book-portal-extension/mock-portal). Public on
## purpose: made-up data only, nothing real behind it. No Authelia.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name bookportal.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 64k;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app bookportal;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
