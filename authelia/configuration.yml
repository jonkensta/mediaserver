# Authelia configuration. Deployed to /opt/mediaserver/authelia/configuration.yml.
#
# Placeholders to replace on deploy (generate each with
# `docker run --rm authelia/authelia:4.39 authelia crypto rand --length 64`):
#   YOUR_AUTHELIA_JWT_SECRET
#   YOUR_AUTHELIA_SESSION_SECRET
#   YOUR_AUTHELIA_STORAGE_ENCRYPTION_KEY
#
# The '/authelia' path prefix on server.address is required by SWAG's stock
# authelia-server.conf / authelia-location.conf snippets (they proxy the portal
# as a subfolder and auth_request /authelia/api/authz/auth-request).

server:
  address: 'tcp://:9091/authelia'

log:
  level: 'info'

identity_validation:
  reset_password:
    jwt_secret: 'YOUR_AUTHELIA_JWT_SECRET'

totp:
  issuer: 'jstarr.me'

authentication_backend:
  file:
    path: '/config/users_database.yml'

access_control:
  default_policy: 'deny'
  rules:
    # Only proxy-confs that include the authelia snippets ever consult this.
    # Jellyfin and FoundryVTT keep their native auth (their non-browser
    # clients cannot follow a forward-auth redirect), so they never match.
    - domain: 'radioambulante.jstarr.me'
      subject: 'group:radioambulante'
      # Low-stakes app for a non-technical user: password only.
      policy: 'one_factor'
    - domain: 'calendar.jstarr.me'
      subject: 'group:calendar'
      # Read-only guests of the calendar (the app gates votes to jstarr): password only.
      policy: 'one_factor'
    - domain: '*.jstarr.me'
      subject: 'group:admins'
      policy: 'two_factor'

# OpenID Connect provider (SSO for apps with native login, e.g. Memos).
# Secrets live in /config/oidc/ (mode 0640, group media), outside this repo:
#   hmac_secret                 - AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE
#   jwks_rsa.key                - RSA 2048 signing key (authelia crypto pair rsa generate)
#   <client>_client_secret.digest - pbkdf2-sha512 digest of the client secret
#                                   (authelia crypto hash generate pbkdf2 --random)
# The "secret" template lines below need X_AUTHELIA_CONFIG_FILTERS=template (compose
# env). Never write double braces in a comment here: the template engine parses
# comments too.
# Issuer: https://authelia.jstarr.me/authelia
identity_providers:
  oidc:
    jwks:
      - key_id: 'main'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/config/oidc/jwks_rsa.key" | mindent 10 "|" | msquote }}
    authorization_policies:
      admins_two_factor:
        default_policy: 'deny'
        rules:
          - subject: 'group:admins'
            policy: 'two_factor'
    clients:
      # Memos (notes.jstarr.me). Memos uses sub as the linked identity; password
      # login is disabled in Memos, so this is the only way in.
      - client_id: 'memos'
        client_name: 'Memos'
        client_secret: {{ secret "/config/oidc/memos_client_secret.digest" | msquote }}
        public: false
        authorization_policy: 'admins_two_factor'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://notes.jstarr.me/auth/callback'
        scopes: ['openid', 'profile', 'email']
        response_types: ['code']
        grant_types: ['authorization_code']
        token_endpoint_auth_method: 'client_secret_basic'

session:
  secret: 'YOUR_AUTHELIA_SESSION_SECRET'
  cookies:
    - domain: 'jstarr.me'
      # Portal lives under the /authelia subfolder (see server.address above).
      authelia_url: 'https://authelia.jstarr.me/authelia/'
      default_redirection_url: 'https://heimdall.jstarr.me'

regulation:
  max_retries: 3
  find_time: '2 minutes'
  ban_time: '10 minutes'

storage:
  encryption_key: 'YOUR_AUTHELIA_STORAGE_ENCRYPTION_KEY'
  local:
    path: '/config/db.sqlite3'

# No SMTP: identity-verification links (TOTP enrollment, password reset) are
# written to /config/notification.txt — read them with
# `docker exec authelia cat /config/notification.txt`.
notifier:
  # Fastmail SMTP; the app password comes from AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE.
  smtp:
    address: 'submissions://smtp.fastmail.com:465'
    username: 'YOUR_FASTMAIL_LOGIN'
    sender: 'Authelia <authelia@jstarr.me>'
